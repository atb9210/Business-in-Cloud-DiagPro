services:
  # ==========================================
  # Laravel App (Nginx + PHP-FPM + Queue Worker)
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: businesscloud-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    env_file:
      - .env.docker
    environment:
      - APP_KEY=${APP_KEY:-}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_SEED=${DB_SEED:-true}
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@businesscloud.it}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme123!}
    volumes:
      - storage_data:/var/www/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - businesscloud
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ==========================================
  # MySQL 8.0
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: businesscloud-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-diagpro}
      MYSQL_USER: ${DB_USERNAME:-diagpro}
      MYSQL_PASSWORD: ${DB_PASSWORD:-diagpro_secure_2024}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    networks:
      - businesscloud
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================
  # Redis 7
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: businesscloud-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-diagpro_redis_2024} --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-16379}:6379"
    networks:
      - businesscloud
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-diagpro_redis_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================
  # Scheduler (cron every minute)
  # ==========================================
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: businesscloud-scheduler
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command: ["while true; do php /var/www/artisan schedule:run --no-interaction >> /dev/null 2>&1; sleep 60; done"]
    env_file:
      - .env.docker
    environment:
      - APP_KEY=${APP_KEY:-}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      app:
        condition: service_healthy
    networks:
      - businesscloud

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local

networks:
  businesscloud:
    driver: bridge
